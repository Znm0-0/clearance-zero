<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Clearance Zero — منصة تعليمية تفاعلية للأمن السيبراني">
<meta name="theme-color" content="#070a09">
<title>Clearance Zero // تدريب الأمن السيبراني</title>
<style>
/* ========== DESIGN SYSTEM ========== */
:root {
  --void: #070a09;
  --void-2: #050706;
  --panel: #0d1512;
  --panel-2: #111c17;
  --line: #1b2e26;
  --line-bright: #2a4a3c;
  --signal: #39ff88;
  --signal-dim: #1c8f52;
  --signal-soft: rgba(57,255,136,.12);
  --cyan: #2fe0e0;
  --cyan-soft: rgba(47,224,224,.12);
  --alert: #ff4d6a;
  --alert-soft: rgba(255,77,106,.12);
  --warn: #ffb020;
  --paper: #dbe8e2;
  --paper-dim: #7fa08f;
  --paper-faint: #4a6459;
  --radius: 6px;
  --radius-lg: 12px;
  --font-ar: "Segoe UI", "Tahoma", "Noto Sans Arabic", sans-serif;
  --font-mono: "SFMono-Regular", "Consolas", "Liberation Mono", "Menlo", monospace;
  --nav-w: 280px;
  --topbar-h: 56px;
  --ease: cubic-bezier(.16,.84,.44,1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  -webkit-text-size-adjust: 100%;
  font-size: 16px;
}
body {
  min-height: 100vh;
  background: var(--void);
  color: var(--paper);
  font-family: var(--font-ar);
  line-height: 1.75;
  overflow-x: hidden;
  position: relative;
  padding-bottom: env(safe-area-inset-bottom);
}
h1,h2,h3,h4 {
  font-family: var(--font-ar);
  font-weight: 800;
  line-height: 1.3;
}
button,input,select,textarea {
  font-family: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: none;
}
a {
  color: var(--cyan);
}
ul {
  list-style: none;
}
img {
  max-width: 100%;
  display: block;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--void-2);
}
::-webkit-scrollbar-thumb {
  background: var(--line-bright);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--signal-dim);
}
* {
  scrollbar-color: var(--line-bright) var(--void-2);
  scrollbar-width: thin;
}

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
  border-radius: 2px;
}

/* Utilities */
.hidden {
  display: none !important;
}
.ltr {
  direction: ltr;
  text-align: left;
}
.rtl {
  direction: rtl;
  text-align: right;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
}
.mono {
  font-family: var(--font-mono);
}
.glow-green {
  text-shadow: 0 0 8px rgba(57,255,136,.55), 0 0 22px rgba(57,255,136,.25);
}
.glow-cyan {
  text-shadow: 0 0 8px rgba(47,224,224,.55), 0 0 22px rgba(47,224,224,.25);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 14px;
  letter-spacing: .02em;
  padding: 12px 22px;
  border-radius: var(--radius);
  border: 1px solid var(--signal-dim);
  background: var(--signal-soft);
  color: var(--signal);
  transition: all .18s var(--ease);
  cursor: pointer;
}
.btn:hover {
  background: rgba(57,255,136,.2);
  box-shadow: 0 0 18px rgba(57,255,136,.3);
  transform: translateY(-1px);
}
.btn:active {
  transform: translateY(0);
}
.btn:disabled {
  opacity: .35;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}
.btn-solid {
  background: var(--signal);
  color: #04140a;
  border-color: var(--signal);
  font-weight: 700;
}
.btn-solid:hover {
  background: #5affa0;
  box-shadow: 0 0 24px rgba(57,255,136,.5);
}
.btn-ghost {
  background: transparent;
  border-color: var(--line-bright);
  color: var(--paper-dim);
}
.btn-ghost:hover {
  border-color: var(--signal-dim);
  color: var(--signal);
  background: var(--signal-soft);
}
.btn-cyan {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-soft);
}
.btn-cyan:hover {
  background: rgba(47,224,224,.2);
  box-shadow: 0 0 18px rgba(47,224,224,.3);
}
.btn-danger {
  border-color: var(--alert);
  color: var(--alert);
  background: var(--alert-soft);
}
.btn-danger:hover {
  background: rgba(255,77,106,.2);
}
.btn-block {
  width: 100%;
}
.btn-sm {
  padding: 8px 14px;
  font-size: 12.5px;
}

/* Cards & Panels */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--line-bright);
  color: var(--paper-dim);
  letter-spacing: .03em;
}
.tag.ok {
  color: var(--signal);
  border-color: var(--signal-dim);
  background: var(--signal-soft);
}
.tag.locked {
  color: var(--paper-faint);
}
.tag.danger {
  color: var(--alert);
  border-color: rgba(255,77,106,.4);
  background: var(--alert-soft);
}

/* Auth Screen */
#authScreen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--void);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: opacity .5s, visibility .5s;
}
#authScreen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.auth-box {
  width: 100%;
  max-width: 400px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
}
.auth-box .logo {
  font-family: var(--font-mono);
  direction: ltr;
  font-size: 20px;
  margin-bottom: 6px;
}
.auth-box .logo .idx {
  color: var(--paper-faint);
  font-size: 12px;
}
.auth-box .logo .accent {
  color: var(--signal);
}
.auth-box .subtitle {
  color: var(--paper-dim);
  font-size: 13px;
  margin-bottom: 20px;
}
.auth-tabs {
  display: flex;
  margin-bottom: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
}
.auth-tab {
  flex: 1;
  padding: 8px;
  font-size: 13px;
  background: transparent;
  color: var(--paper-dim);
  transition: 0.2s;
}
.auth-tab.active {
  background: var(--signal-soft);
  color: var(--signal);
}
.field {
  margin-bottom: 14px;
  text-align: right;
}
[dir="ltr"] .field {
  text-align: left;
}
.field label {
  display: block;
  font-size: 12px;
  color: var(--paper-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px;
  background: var(--void-2);
  border: 1px solid var(--line-bright);
  border-radius: var(--radius);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 14px;
  direction: ltr;
  text-align: left;
}
.auth-error {
  color: var(--alert);
  font-size: 12px;
  margin-top: 8px;
  min-height: 18px;
}

/* Background Effects */
#matrixCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: .4;
  pointer-events: none;
}
#scanlines {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.08) 3px);
  mix-blend-mode: multiply;
  opacity: .3;
}
#vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%);
}

/* Boot Screen */
#bootScreen {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--void);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: opacity .6s var(--ease), visibility .6s;
}
#bootScreen.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.boot-box {
  width: 100%;
  max-width: 640px;
  font-family: var(--font-mono);
  direction: ltr;
  text-align: left;
}
.boot-lines {
  min-height: 200px;
  font-size: 13px;
  line-height: 1.9;
  color: var(--signal);
  white-space: pre-wrap;
  word-break: break-word;
}
.boot-lines .dim {
  color: var(--paper-dim);
}
.boot-lines .cyan-line {
  color: var(--cyan);
}
.boot-cta {
  margin-top: 28px;
  direction: rtl;
  text-align: center;
  opacity: 0;
  transform: translateY(10px);
  transition: all .5s var(--ease);
}
.boot-cta.show {
  opacity: 1;
  transform: translateY(0);
}
.boot-title {
  font-family: var(--font-ar);
  direction: rtl;
  font-size: 14px;
  color: var(--paper-dim);
  margin-bottom: 14px;
}

/* Topbar */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-h);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: rgba(7,10,9,.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-start {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-bright);
  border-radius: var(--radius);
  color: var(--paper-dim);
  font-size: 16px;
  transition: all .15s var(--ease);
}
.icon-btn:hover {
  color: var(--signal);
  border-color: var(--signal-dim);
  background: var(--signal-soft);
}
.brand {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .02em;
  direction: ltr;
  color: var(--paper);
  white-space: nowrap;
}
.brand .accent {
  color: var(--signal);
}
.brand .idx {
  color: var(--paper-faint);
  font-size: 10px;
}
.topbar-end {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-chip {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--paper-dim);
  border: 1px solid var(--line-bright);
  border-radius: 20px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.stat-chip b {
  color: var(--signal);
  font-weight: 700;
}
.stat-chip.cyan b {
  color: var(--cyan);
}
.lang-switch {
  display: flex;
  gap: 2px;
  margin-inline-end: 4px;
}
.lang-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--paper-dim);
  transition: all .15s;
}
.lang-btn.active {
  background: var(--signal-soft);
  color: var(--signal);
}
.user-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  background: var(--panel);
  border: 1px solid var(--line-bright);
  cursor: pointer;
  white-space: nowrap;
}
.user-pill .avatar {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--signal);
  color: #04140a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-mono);
}

/* Side Nav */
.nav-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 34;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s var(--ease), visibility .25s;
}
.nav-overlay.open {
  opacity: 1;
  visibility: visible;
}
.side-nav {
  position: fixed;
  top: var(--topbar-h);
  right: 0;
  width: min(85vw, var(--nav-w));
  height: calc(100vh - var(--topbar-h));
  z-index: 35;
  background: var(--void-2);
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  transition: transform .3s var(--ease);
  overflow-y: auto;
  padding: 18px 16px 100px;
}
[dir="ltr"] .side-nav {
  right: auto;
  left: 0;
  transform: translateX(-100%);
  border-left: none;
  border-right: 1px solid var(--line);
}
.side-nav.open {
  transform: translateX(0);
}
.nav-block-title {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .12em;
  color: var(--paper-faint);
  text-transform: uppercase;
  margin: 20px 0 10px;
  padding-inline-start: 4px;
}
.overall-progress-wrap {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
}
.overall-progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--paper-dim);
  margin-bottom: 8px;
}
.progress-bar {
  height: 8px;
  border-radius: 20px;
  background: var(--void-2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 20px;
  background: linear-gradient(90deg, var(--signal-dim), var(--signal));
  width: 0%;
  transition: width .5s var(--ease);
  box-shadow: 0 0 10px rgba(57,255,136,.5);
}
.level-line {
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--cyan);
}

.module-nav-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.module-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  transition: all .15s var(--ease);
}
.module-nav-item.clickable {
  cursor: pointer;
}
.module-nav-item.clickable:hover {
  background: var(--panel);
  border-color: var(--line-bright);
}
.module-nav-item.active {
  background: var(--signal-soft);
  border-color: var(--signal-dim);
}
.module-nav-item.done .module-nav-idx {
  background: var(--signal);
  border-color: var(--signal);
  color: #04140a;
}
.module-nav-item.locked {
  opacity: .5;
  pointer-events: none;
}
.module-nav-idx {
  font-family: var(--font-mono);
  font-size: 11px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--line-bright);
  color: var(--paper-dim);
}
.module-nav-text {
  flex: 1;
  min-width: 0;
}
.module-nav-title {
  font-size: 13.5px;
  color: var(--paper);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.module-nav-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--paper-faint);
  direction: ltr;
  text-align: right;
}
.nav-cta-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 22px;
}
.nav-cta {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: var(--radius);
  border: 1px solid var(--line-bright);
  color: var(--paper);
  font-size: 13.5px;
  transition: all .15s var(--ease);
}
.nav-cta:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-soft);
}
.nav-cta.logout-cta {
  color: var(--alert);
  border-color: rgba(255,77,106,.4);
}
.nav-cta.logout-cta:hover {
  background: var(--alert-soft);
  border-color: var(--alert);
}
.nav-cta .n {
  margin-inline-start: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--paper-faint);
}

/* Desktop: side nav always visible */
@media(min-width: 1080px) {
  .side-nav {
    position: fixed;
    transform: none;
    border-left: 1px solid var(--line);
  }
  [dir="ltr"] .side-nav {
    transform: none;
    border-right: 1px solid var(--line);
  }
  .nav-overlay {
    display: none;
  }
  #menuToggle {
    display: none;
  }
  .main-content {
    padding-inline-end: var(--nav-w);
  }
  [dir="ltr"] .main-content {
    padding-inline-end: 0;
    padding-inline-start: var(--nav-w);
  }
}

/* Main Content */
.main-content {
  padding-top: var(--topbar-h);
  position: relative;
  z-index: 5;
  min-height: 100vh;
}
.view {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 16px 100px;
  animation: viewIn .35s var(--ease);
}
@keyframes viewIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Bottom Nav (Mobile) */
.bottom-nav {
  display: flex;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  height: 60px;
  background: rgba(7,10,9,.92);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  justify-content: space-around;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
}
@media(min-width: 1080px) {
  .bottom-nav {
    display: none;
  }
}
.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  font-size: 10px;
  color: var(--paper-faint);
  transition: all .15s;
  border-radius: var(--radius);
}
.bottom-nav-item.active {
  color: var(--signal);
}
.bottom-nav-item .ico {
  font-size: 18px;
}

/* Hero & Cards */
.hero-panel {
  padding: 24px 20px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: linear-gradient(145deg, var(--panel), var(--panel-2));
  position: relative;
  overflow: hidden;
  margin-bottom: 24px;
}
.hero-panel::after {
  content: "";
  position: absolute;
  right: -40px;
  top: -40px;
  width: 160px;
  height: 160px;
  background: radial-gradient(circle, rgba(57,255,136,.18), transparent 70%);
  pointer-events: none;
}
.hero-h1 {
  font-size: clamp(22px, 5vw, 30px);
  margin-bottom: 10px;
}
.hero-h1 .zero {
  color: var(--signal);
}
.hero-desc {
  color: var(--paper-dim);
  font-size: 14.5px;
  max-width: 60ch;
}
.hero-stats-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.mini-stat {
  flex: 1;
  min-width: 100px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--void-2);
}
.mini-stat .num {
  font-family: var(--font-mono);
  font-size: 20px;
  color: var(--signal);
  font-weight: 700;
}
.mini-stat .lbl {
  font-size: 11.5px;
  color: var(--paper-dim);
  margin-top: 2px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 16px;
}
.section-title h2 {
  font-size: 17px;
}
.section-title .line {
  flex: 1;
  height: 1px;
  background: var(--line-bright);
}

.module-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media(min-width: 640px) {
  .module-grid {
    grid-template-columns: 1fr 1fr;
  }
}
.module-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  transition: all .18s var(--ease);
  text-align: right;
  position: relative;
  overflow: hidden;
}
.module-card.clickable {
  cursor: pointer;
}
.module-card.clickable:hover {

  opacity: .5;

}

  margin-bottom: 10px;

  font-size: 11px;
  color: var(--signal);
  direction: ltr;

  font-size: 15px;
  margin-bottom: 6px;
}
.module-card p {
  font-size: 12.5px;
  color: var(--paper-dim);
}
.module-card-icon {
  font-size: 22px;
}

  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

  .challenge-grid {
    grid-template-columns: 1fr 1fr;
  }
}
.challenge-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  position: relative;
  transition: all .18s var(--ease);
}
.challenge-card.clickable {
  cursor: pointer;
}
.challenge-card.clickable:hover {
  border-color: var(--cyan);
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(0,0,0,.35);
}
.challenge-card.locked {
  opacity: .45;
  pointer-events: none;
}
.challenge-card .top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.challenge-card .ico {
  font-size: 26px;
}
.challenge-card h3 {
  font-size: 14.5px;
  margin-bottom: 4px;
}
.challenge-card p {
  font-size: 12px;
  color: var(--paper-dim);
}
.challenge-card .pts {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--signal);
}

/* Badges */
.badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.badge-tile {
  padding: 14px 10px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
}
.badge-tile.earned {
  border-color: var(--signal-dim);
  background: var(--signal-soft);
}
.badge-tile .ico {
  font-size: 26px;
  margin-bottom: 6px;
  filter: grayscale(1);
  opacity: .4;
}
.badge-tile.earned .ico {
  filter: none;
  opacity: 1;
}
.badge-tile .nm {
  font-size: 11.5px;
  color: var(--paper-dim);
}
.badge-tile.earned .nm {
  color: var(--paper);
}

.term-window {
  border: 1px solid var(--line-bright);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: #01100a;
}
.term-body {
  padding: 14px;

  font-family: var(--font-mono);
  font-size: 13px;
  direction: ltr;
  text-align: left;
}
.term-line {
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--paper);
  margin-bottom: 2px;
}
.term-inputrow {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  background: #01100a;
}
.term-prompt {
  font-family: var(--font-mono);
  color: var(--signal);
  font-size: 13px;
}
.term-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 13px;
  direction: ltr;
  text-align: left;
  padding-inline-start: 8px;
  outline: none;
}

/* Toast */
#toastLayer {
  position: fixed;
  top: calc(var(--topbar-h) + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  min-width: 260px;
  max-width: 90vw;
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  background: var(--panel);
  border: 1px solid var(--signal);
  box-shadow: 0 0 30px rgba(57,255,136,.25), 0 10px 30px rgba(0,0,0,.4);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: toastIn .4s var(--ease) forwards;
}
.toast.leaving {
  animation: toastOut .35s var(--ease) forwards;
}
@keyframes toastIn {
  to { opacity: 1; }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(-10px); }
}

/* Settings Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(2,4,3,.75);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s, visibility .25s;
}
.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}
@media(min-width: 640px) {
  .modal-overlay {
    align-items: center;
  }
}
.modal-box {
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line-bright);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 22px;
  transform: translateY(30px);
  transition: transform .3s var(--ease);
}
.modal-overlay.open .modal-box {
  transform: translateY(0);
}
@media(min-width: 640px) {
  .modal-box {
    border-radius: var(--radius-lg);
  }
}

/* Quiz */
.quiz-gate {
  text-align: center;
  padding: 26px 16px;
  border: 1px dashed var(--line-bright);
  border-radius: var(--radius-lg);
  margin-top: 10px;
}
.quiz-q {

.quiz-opt {
  display: flex;

  padding: 12px 14px;

  border-radius: var(--radius);
  font-size: 13.5px;
  transition: all .15s var(--ease);
  text-align: right;
  cursor: pointer;
}
.quiz-opt:hover {
  border-color: var(--signal-dim);
  background: var(--signal-soft);

.quiz-opt.correct {
  border-color: var(--signal);
  background: var(--signal-soft);
}
.quiz-opt.wrong {
  border-color: var(--alert);
  background: var(--alert-soft);
}

/* File chrome */
.file-chrome {
  font-family: var(--font-mono);
  direction: ltr;
  text-align: left;
  font-size: 12px;

  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.file-chrome .path {

}

  direction: ltr;
  text-align: center;
  padding: 16px;
  background: var(--void-2);
  border-radius: var(--radius);
  margin: 12px 0;
  word-break: break-all;

.mail-card {
  border: 1px solid var(--line);

  background: var(--panel);

}

}

  padding: 16px;

// ==================== LANGUAGE ====================
function t(key) { return TR[currentLang]?.[key] || TR['ar'][key] || key; }
function applyLanguage() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-lang]').forEach(el => {
    const key = el.dataset.lang;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(key);
    else el.textContent = t(key);
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  updateAllUI();
}

// ==================== AUTH ====================
function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch(e) { return {}; } }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSavedUser() { return localStorage.getItem(CURRENT_USER_KEY); }
function setSavedUser(u) { localStorage.setItem(CURRENT_USER_KEY, u); }
function clearSavedUser() { localStorage.removeItem(CURRENT_USER_KEY); }

function login(username, password) {
  const users = getUsers();
  if (!username || !password) return { error: t('login_error_empty') };
  if (!users[username]) return { error: t('login_error_user') };
  if (users[username].password !== password) return { error: t('login_error_pass') };
  setSavedUser(username);
  currentUser = username;
  userProgress = users[username].progress || { completedModules: [], completedQuizzes: {}, completedChallenges: [], earnedBadges: [], bossCompleted: false, xp: 0 };
  return { success: true };
}

function register(username, password, confirm) {
  if (!username || !password || !confirm) return { error: t('reg_error_empty') };
  if (password !== confirm) return { error: t('reg_error_match') };
  const users = getUsers();
  if (users[username]) return { error: t('reg_error_exists') };
  users[username] = { password, progress: { completedModules: [], completedQuizzes: {}, completedChallenges: [], earnedBadges: [], bossCompleted: false, xp: 0 } };
  saveUsers(users);
  return { success: true };
}

function logout() {
  clearSavedUser();
  currentUser = null;
  userProgress = null;
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('bootScreen').classList.remove('fade-out');
  document.querySelectorAll('#loginUser, #loginPass, #regUser, #regPass, #regConfirm').forEach(el => el.value = '');
  document.getElementById('loginError').textContent = '';
  document.getElementById('regError').textContent = '';
  document.getElementById('view').innerHTML = '';
}

function saveProgress() {
  if (!currentUser || !userProgress) return;
  const users = getUsers();
  if (users[currentUser]) {
    users[currentUser].progress = userProgress;
    saveUsers(users);
  }
}

// ==================== HELPERS ====================
function showToast(msg) {
  const layer = document.getElementById('toastLayer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  layer.appendChild(toast);
  setTimeout(() => { toast.classList.add('leaving'); setTimeout(() => toast.remove(), 400); }, 2500);
}

function addXP(amount) {
  if (!userProgress) return;
  userProgress.xp += amount;
  saveProgress();
  updateAllUI();
  showToast(`+${amount} XP`);
}

function completeModule(id) {
  if (!userProgress || userProgress.completedModules.includes(id)) return;
  userProgress.completedModules.push(id);
  addXP(100);
  saveProgress();
  checkBadges();
}
function completeQuiz(id) {
  if (!userProgress || userProgress.completedQuizzes[id]) return;
  userProgress.completedQuizzes[id] = true;
  addXP(50);
  saveProgress();
}
function completeChallenge(id) {
  if (!userProgress || userProgress.completedChallenges.includes(id)) return;
  userProgress.completedChallenges.push(id);
  const ch = CHALLENGES_DATA.find(c => c.id === id);
  if (ch) addXP(ch.xp);
  saveProgress();
  checkBadges();
}
function checkBadges() {
  let changed = false;
  BADGES_DATA.forEach(b => {
    if (!userProgress.earnedBadges.includes(b.id) && b.cond()) {
      userProgress.earnedBadges.push(b.id);
      changed = true;
      showToast(`🎖️ ${b.name}`);
    }
  });
  if (changed) saveProgress();
}
function isModuleUnlocked(id) {
  const mod = MODULES_DATA.find(m => m.id === id);
  return mod && (!mod.req || userProgress?.completedModules.includes(mod.req));
}
function isChallengeUnlocked(id) {
  const ch = CHALLENGES_DATA.find(c => c.id === id);
  return ch && (!ch.req || userProgress?.completedModules.includes(ch.req));
}

function updateAllUI() {
  updateTopBar();
  updateProgressUI();
  renderSideNav();
  const view = document.getElementById('view');
  const currentView = view.dataset.currentView;
  if (currentView) {
    const navMap = {
      'home': renderHome, 'module': () => renderModule(view.dataset.moduleId),
      'challenges': renderChallengesHub, 'challenge': () => renderChallenge(view.dataset.challengeId),
      'badges': renderBadges
    };
    if (navMap[currentView]) navMap[currentView]();
  }
}

function updateTopBar() {
  document.getElementById('topLevel').textContent = userProgress ? Math.floor(userProgress.xp / 200) + 1 : 1;
  document.getElementById('topXP').textContent = userProgress?.xp || 0;
  document.getElementById('userNameDisplay').textContent = currentUser || 'زائر';
  document.getElementById('userAvatar').textContent = (currentUser || 'ز')[0].toUpperCase();
}

function updateProgressUI() {
  const total = MODULES_DATA.length;
  const completed = userProgress?.completedModules.length || 0;
  const pct = total ? Math.round((completed / total) * 100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('overallProgressFill').style.width = pct + '%';
  document.getElementById('levelLine').textContent = `LV.${Math.floor((userProgress?.xp || 0) / 200) + 1} // ${t('progress')}`;
}

function navigateTo(view, param) {
  const viewEl = document.getElementById('view');
  viewEl.dataset.currentView = view;
  if (param) viewEl.dataset[view === 'module' ? 'moduleId' : 'challengeId'] = param;
  switch(view) {
    case 'home': renderHome(); break;
    case 'module': renderModule(param); break;
    case 'challenges': renderChallengesHub(); break;
    case 'challenge': renderChallenge(param); break;
    case 'badges': renderBadges(); break;
    default: renderHome();
  }
  renderSideNav();
  document.querySelectorAll('.bottom-nav-item').forEach(n => n.classList.remove('active'));
  const active = document.querySelector(`.bottom-nav-item[data-nav="${view}"]`);
  if (active) active.classList.add('active');
  closeSideNav();
}

function renderSideNav() {
  const list = document.getElementById('moduleNavList');
  list.innerHTML = MODULES_DATA.map(m => {
    const done = userProgress?.completedModules.includes(m.id);
    const unlocked = isModuleUnlocked(m.id);
    let cls = 'module-nav-item';
    if (done) cls += ' done';
    if (!unlocked) cls += ' locked';
    if (unlocked) cls += ' clickable';
    return `<li class="${cls}" data-module="${m.id}">
      <span class="module-nav-idx">${m.idx}</span>
      <span class="module-nav-text"><span class="module-nav-title">${m.title}</span>
      <span class="module-nav-sub">${done ? t('completed') : (unlocked ? t('available') : t('locked'))}</span></span>
    </li>`;
  }).join('');
  list.querySelectorAll('.module-nav-item.clickable').forEach(el => {
    el.addEventListener('click', () => navigateTo('module', el.dataset.module));
  });
}

function renderModule(id) {
  const mod = MODULES_DATA.find(m => m.id === id);
  if (!mod) return navigateTo('home');
  const v = document.getElementById('view');
  const quizDone = userProgress?.completedQuizzes[id];
  v.innerHTML = `
    <div class="file-chrome"><span class="path">modules/${mod.idx}_${mod.id}</span></div>
    <div class="module-head"><h1>${mod.icon} ${mod.title}</h1><p class="desc">${mod.desc}</p></div>
    ${mod.lessons.map(l => `<div class="panel" style="padding:14px;margin-bottom:12px;"><h3>📖 ${l.title}</h3><p>${l.content}</p></div>`).join('')}
    <div id="quizArea">${quizDone ? '<div class="panel" style="text-align:center;padding:20px;">✅ ' + t('completed') + '</div>' :
      `<div class="quiz-gate"><p>اختبر معرفتك</p><button class="btn btn-cyan" id="startQuizBtn">${t('start_quiz')}</button></div>`}</div>`;
  if (!quizDone) document.getElementById('startQuizBtn').addEventListener('click', () => startQuiz(mod));
}

function startQuiz(mod) {
  let idx = 0, score = 0;
  const area = document.getElementById('quizArea');
  function show() {
    if (idx >= mod.quiz.length) { showResult(); return; }
    const q = mod.quiz[idx];
    area.innerHTML = `<div class="quiz-q"><div class="quiz-q-text">${q.q}</div>${q.opts.map((o,i) => `<div class="quiz-opt" data-idx="${i}">${o}</div>`).join('')}</div>`;
    area.querySelectorAll('.quiz-opt').forEach(o => o.addEventListener('click', function() {
      if (this.dataset.done) return;
      area.querySelectorAll('.quiz-opt').forEach(el => el.dataset.done = '1');
      const sel = parseInt(this.dataset.idx);
      if (sel === q.ans) { this.classList.add('correct'); score++; }
      else { this.classList.add('wrong'); area.querySelector(`.quiz-opt[data-idx="${q.ans}"]`).classList.add('correct'); }
      setTimeout(() => { idx++; show(); }, 700);
    }));
  }
  function showResult() {
    const pct = Math.round((score / mod.quiz.length) * 100);
    area.innerHTML = `<div class="panel" style="text-align:center;padding:20px;"><h2>${score}/${mod.quiz.length}</h2>
      <p>${pct >= 70 ? '🎉 ' + t('correct') : '😞 ' + t('wrong')}</p>
      ${pct >= 70 ? `<button class="btn btn-solid" id="finishBtn">${t('finish')}</button>` : `<button class="btn btn-cyan" id="retryBtn">${t('retry')}</button>`}</div>`;
    if (pct >= 70) {
      document.getElementById('finishBtn').addEventListener('click', () => { completeQuiz(mod.id); completeModule(mod.id); renderModule(mod.id); });
    } else {
      document.getElementById('retryBtn').addEventListener('click', () => { idx = 0; score = 0; show(); });
    }
  }
  show();
}

function renderChallenge(id) {
  const ch = CHALLENGES_DATA.find(c => c.id === id);
  if (!ch) return navigateTo('challenges');
  const v = document.getElementById('view');
  const done = userProgress?.completedChallenges.includes(id);
  let html = `<div class="module-head"><h1>${ch.icon} ${ch.title}</h1></div>`;
  if (done) { html += '<div class="panel" style="text-align:center;padding:20px;">✅ ' + t('completed') + '</div>'; v.innerHTML = html; return; }
  switch(ch.type) {
    case 'decode': html += `<div class="panel"><div class="cipher-text">${ch.data.cipher}</div>
      <input class="field-input" id="decInput" placeholder="${t('decode')}..." style="width:100%;padding:10px;background:var(--void-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--paper);margin-bottom:8px;">

      <button class="btn btn-ghost btn-sm" id="decHint">💡</button><p id="decHintText" style="display:none;color:var(--cyan);margin-top:8px;"></p></div>`; break;
    case 'phishing': html += `<div class="mail-card"><div class="mail-head"><strong>${ch.data.from}</strong><br>${ch.data.subject}</div>
      <div class="mail-body">${ch.data.body}</div><div style="padding:12px;display:flex;gap:8px;"><button class="btn btn-danger btn-sm" id="phishYes">⚠️ ${t('correct')}</button>
      <button class="btn btn-ghost btn-sm" id="phishNo">✓ ${t('wrong')}</button></div></div>`; break;
    case 'terminal': html += `<div class="term-window"><div class="term-body" id="termBody"><div>guest@cz:~$</div></div>
      <div class="term-inputrow"><span class="term-prompt">$</span><input class="term-input" id="termInput" placeholder="command..."></div></div>`; break;
    case 'password': html += `<div class="panel"><input class="pw-input" id="pwInput" placeholder="${t('password')}..." style="width:100%;padding:10px;background:var(--void-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--paper);">
      <div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" id="pwFill" style="width:0%;"></div></div><p id="pwVerdict"></p><button class="btn btn-cyan btn-sm" id="pwComplete" style="display:none;">${t('finish')}</button></div>`; break;
    case 'sqli': html += `<div class="panel"><p>Username: admin</p><input id="sqliPass" placeholder="Payload..." style="width:100%;padding:10px;background:var(--void-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--paper);margin-top:8px;">
      <button class="btn btn-cyan btn-sm" id="sqliLogin" style="margin-top:8px;">Login</button></div>`; break;
    case 'log': html += `<div class="panel">${ch.data.logs.map((l,i) => `<div class="log-line" data-idx="${i}" style="padding:8px;cursor:pointer;font-family:var(--font-mono);font-size:12px;border-bottom:1px solid var(--line);">${l.text}</div>`).join('')}
      </div><button class="btn btn-cyan btn-sm" id="logCheck" style="margin-top:8px;">✓</button>`; break;
  }
  v.innerHTML = html;
  if (!done) initChallenge(ch);
}

function initChallenge(ch) {
  switch(ch.type) {
    case 'decode': document.getElementById('decCheck').addEventListener('click', () => {
      if (document.getElementById('decInput').value.trim() === ch.data.answer) { completeChallenge(ch.id); showToast('🎉'); renderChallenge(ch.id); }
      else showToast('❌');
    });
    document.getElementById('decHint').addEventListener('click', () => {
      const h = document.getElementById('decHintText'); h.textContent = ch.data.hints[0]; h.style.display = 'block';
    }); break;
    case 'phishing': document.getElementById('phishYes').addEventListener('click', () => { completeChallenge(ch.id); showToast('🎉'); renderChallenge(ch.id); });
    document.getElementById('phishNo').addEventListener('click', () => showToast('❌')); break;
    case 'terminal': document.getElementById('termInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const cmd = this.value.trim();
        const body = document.getElementById('termBody');
        body.innerHTML += `<div>$ ${cmd}</div>`;
        if (ch.data.cmds[cmd]) {
          body.innerHTML += `<div style="color:var(--signal);">${ch.data.cmds[cmd]}</div>`;
          if (ch.data.cmds[cmd].includes(ch.data.flag)) { completeChallenge(ch.id); showToast('🏆'); renderChallenge(ch.id); }
        } else body.innerHTML += `<div style="color:var(--alert);">not found</div>`;
        this.value = ''; body.scrollTop = body.scrollHeight;
      }
    }); break;
    case 'password': document.getElementById('pwInput').addEventListener('input', function() {
      const pw = this.value; let s = 0;
      if (pw.length >= 8) s += 25; if (pw.length >= 12) s += 25;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s += 25; if (/\d/.test(pw)) s += 15; if (/[^a-zA-Z0-9]/.test(pw)) s += 10;
      document.getElementById('pwFill').style.width = s + '%';
      document.getElementById('pwFill').style.background = s >= 100 ? 'var(--signal)' : s >= 60 ? 'var(--warn)' : 'var(--alert)';
      document.getElementById('pwVerdict').textContent = s >= 100 ? 'قوي ✓' : s >= 60 ? 'متوسط' : 'ضعيف';
      document.getElementById('pwComplete').style.display = s >= 100 ? 'inline-block' : 'none';
    });
    document.getElementById('pwComplete').addEventListener('click', () => { completeChallenge(ch.id); showToast('🔐'); renderChallenge(ch.id); }); break;
    case 'sqli': document.getElementById('sqliLogin').addEventListener('click', () => {
      const p = document.getElementById('sqliPass').value.trim();
      if (ch.data.payloads.some(v => p.toLowerCase().replace(/\s+/g, ' ') === v.toLowerCase().replace(/\s+/g, ' '))) {
        completeChallenge(ch.id); showToast('💉'); renderChallenge(ch.id);
      } else showToast('❌');
    }); break;
    case 'log': const flagged = new Set();
    document.querySelectorAll('.log-line').forEach(el => el.addEventListener('click', function() {
      const idx = parseInt(this.dataset.idx);
      if (flagged.has(idx)) { flagged.delete(idx); this.style.background = ''; }
      else { flagged.add(idx); this.style.background = 'var(--alert-soft)'; }
    }));
    document.getElementById('logCheck').addEventListener('click', () => {
      const correct = new Set(ch.data.logs.reduce((a, l, i) => { if (l.sus) a.push(i); return a; }, []));
      if (correct.size === flagged.size && [...correct].every(v => flagged.has(v))) {
        completeChallenge(ch.id); showToast('📋'); renderChallenge(ch.id);
      } else showToast('❌');
    }); break;
  }
}

function renderBadges() {
  const v = document.getElementById('view');
  v.innerHTML = `<div class="module-head"><h1>🎖️ ${t('badges')}</h1></div>
    <div class="badge-grid">${BADGES_DATA.map(b => {
      const earned = userProgress?.earnedBadges.includes(b.id);
      return `<div class="badge-tile ${earned ? 'earned' : ''}"><div class="ico">${b.icon}</div><div class="nm">${b.name}</div>${earned ? '<span class="tag ok">✓</span>' : ''}</div>`;
    }).join('')}</div>`;
}

// ==================== SIDE NAV ====================
function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('navOverlay').classList.add('open'); }
function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('navOverlay').classList.remove('open'); }

// ==================== MATRIX CANVAS ====================
function initMatrix() {
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const chars = '01';
  const fontSize = 14;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);
  setInterval(() => {
    ctx.fillStyle = 'rgba(7,10,9,0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1c8f52'; ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      ctx.fillText(chars[Math.floor(Math.random() * 2)], i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 45);
}

// ==================== BOOT SEQUENCE ====================
function initBoot() {
  const bootLines = document.getElementById('bootLines');
  const bootCta = document.getElementById('bootCta');
  const bootScreen = document.getElementById('bootScreen');
  const lines = ['INITIALIZING...', 'CHECKING SECURE ENCLAVE: <span class="cyan-line">OK</span>', '<span class="cyan-line">CLEARANCE ZERO — READY.</span>'];
  let i = 0;
  function type() {
    if (i < lines.length) { const div = document.createElement('div'); div.innerHTML = lines[i]; bootLines.appendChild(div); i++; setTimeout(type, 400); }
    else bootCta.classList.add('show');
  }
  bootLines.innerHTML = ''; setTimeout(type, 300);
  document.getElementById('enterBtn').addEventListener('click', () => {
    bootScreen.classList.add('fade-out');
    if (currentUser) { navigateTo('home'); updateAllUI(); }
  });
}

// ==================== SETTINGS MODAL ====================
function initSettings() {
  const modal = document.getElementById('settingsModal');
  document.getElementById('settingsBtn').addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('settingsMobileBtn').addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    APP.settings.provider = document.getElementById('providerSelect').value;
    APP.settings.model = document.getElementById('modelInput').value.trim();
    APP.settings.apiKey = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem('cz_settings', JSON.stringify(APP.settings));
    document.getElementById('keyStatus').textContent = APP.settings.apiKey ? '✓ محفوظ' : 'غير محفوظ';
    document.getElementById('keyStatus').className = APP.settings.apiKey ? 'tag ok' : 'tag locked';
    modal.classList.remove('open'); showToast('⚙️ تم الحفظ');
  });
  document.getElementById('clearKeyBtn').addEventListener('click', () => {
    APP.settings.apiKey = ''; document.getElementById('apiKeyInput').value = '';
    localStorage.setItem('cz_settings', JSON.stringify(APP.settings));
    document.getElementById('keyStatus').textContent = 'غير محفوظ'; document.getElementById('keyStatus').className = 'tag locked';
  });
  document.getElementById('resetProgressBtn').addEventListener('click', () => {
    if (confirm('تأكيد إعادة التعيين؟')) { if (currentUser) { userProgress = { completedModules: [], completedQuizzes: {}, completedChallenges: [], earnedBadges: [], bossCompleted: false, xp: 0 }; saveProgress(); } updateAllUI(); navigateTo('home'); modal.classList.remove('open'); }
  });
  // Load settings
  const saved = JSON.parse(localStorage.getItem('cz_settings') || '{}');
  Object.assign(APP.settings, saved);
  document.getElementById('providerSelect').value = APP.settings.provider;
  document.getElementById('modelInput').value = APP.settings.model;
  document.getElementById('apiKeyInput').value = APP.settings.apiKey;
  document.getElementById('keyStatus').textContent = APP.settings.apiKey ? '✓ محفوظ' : 'غير محفوظ';
  document.getElementById('keyStatus').className = APP.settings.apiKey ? 'tag ok' : 'tag locked';
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  initMatrix();
  initBoot();
  initSettings();

  // Auth tabs
  document.getElementById('authTabs').addEventListener('click', e => {
    if (e.target.classList.contains('auth-tab')) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('loginForm').style.display = e.target.dataset.tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = e.target.dataset.tab === 'register' ? 'block' : 'none';
    }
  });

  // Login
  document.getElementById('loginBtn').addEventListener('click', () => {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const res = login(u, p);
    if (res.error) document.getElementById('loginError').textContent = res.error;
    else { document.getElementById('authScreen').classList.add('hidden'); navigateTo('home'); updateAllUI(); }
  });

  // Register
  document.getElementById('registerBtn').addEventListener('click', () => {
    const u = document.getElementById('regUser').value.trim();
    const p = document.getElementById('regPass').value;
    const c = document.getElementById('regConfirm').value;
    const res = register(u, p, c);
    if (res.error) document.getElementById('regError').textContent = res.error;
    else { document.getElementById('regError').textContent = ''; showToast(t('reg_success')); login(u, p); document.getElementById('authScreen').classList.add('hidden'); navigateTo('home'); updateAllUI(); }
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', () => { closeSideNav(); logout(); });
  document.getElementById('userPill').addEventListener('click', () => openSideNav());

  // Side nav
  document.getElementById('menuToggle').addEventListener('click', openSideNav);
  document.getElementById('navOverlay').addEventListener('click', closeSideNav);
  document.querySelectorAll('.nav-cta[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => { navigateTo(btn.dataset.nav); closeSideNav(); });
  });

  // Bottom nav
  document.getElementById('bottomNav').addEventListener('click', e => {
    const item = e.target.closest('.bottom-nav-item');
    if (item && item.dataset.nav) navigateTo(item.dataset.nav);
  });

  // Language switch
  document.getElementById('langSwitch').addEventListener('click', e => {
    if (e.target.classList.contains('lang-btn')) {
      currentLang = e.target.dataset.lang;
      applyLanguage();
    }
  });

  // Check saved user
  const savedUser = getSavedUser();
  if (savedUser) {
    const users = getUsers();
    if (users[savedUser]) {
      currentUser = savedUser;
      userProgress = users[savedUser].progress || { completedModules: [], completedQuizzes: {}, completedChallenges: [], earnedBadges: [], bossCompleted: false, xp: 0 };
      document.getElementById('authScreen').classList.add('hidden');
    }
  }

  applyLanguage();
});
</script>
